name: Build Photo Select desktop

on:
  push:
    branches: [main, 'codex/**']
    paths-ignore: ['docs/**', 'TODO.md']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: photo-select-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-engine.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Install Python dependencies
        run: python -m pip install -r requirements-engine.txt -r requirements-dev.txt
      - name: Check and test image engine and Lightroom bridge
        shell: bash
        run: |
          python -m black --check culling_engine engine_entry.py scripts tests
          python -m ruff check culling_engine engine_entry.py scripts tests
          python -m unittest discover -s tests -v
          python -m culling_engine self-test
      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci
      - name: Frontend checks
        working-directory: desktop
        shell: bash
        run: |
          npm test
          npm run build
      - name: Rust persistence and engine integration tests
        working-directory: desktop/src-tauri
        shell: pwsh
        run: |
          $env:PHOTO_SELECT_PYTHON = (Get-Command python).Source
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --no-default-features --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --no-default-features --locked --test engine_integration -- --ignored
      - name: Bundle and independently smoke-test the Python worker
        run: python scripts/build_engine.py
      - name: Test Rust with the bundled Windows worker
        working-directory: desktop/src-tauri
        shell: pwsh
        run: |
          $env:PHOTO_SELECT_PYTHON = (Get-Command python).Source
          $env:PHOTO_SELECT_ENGINE = (Resolve-Path resources/engine/photo-select-engine.exe).Path
          cargo test --no-default-features --locked --test engine_integration -- --ignored
      - name: Generate dependency notices
        run: python scripts/dependency_notices.py
      - name: Build native Windows installer
        working-directory: desktop
        run: npm run tauri -- build --bundles nsis
      - name: Assemble test packages
        run: python scripts/collect_windows_package.py
      - name: Verify portable application and installed application
        shell: pwsh
        run: ./scripts/smoke_windows_package.ps1
      - name: Upload Windows test package
        uses: actions/upload-artifact@v4
        with:
          name: Photo-Select-0.2.0-Windows-x64
          path: artifacts/windows/*
          if-no-files-found: error
          retention-days: 30
